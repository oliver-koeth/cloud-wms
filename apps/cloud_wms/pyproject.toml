[project]
name = "cloud_wms"
authors = [
    { name = "Cloud WMS", email = "wms@cloud-wms.local"}
]
description = "Warehouse workflow API over ERPNext Sales Orders, Pick Lists and Delivery Notes"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.format]
indent-style = "tab"
docstring-code-format = true
