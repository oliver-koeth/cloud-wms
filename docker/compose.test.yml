# Isolated stack for `make app-test`. Never shares data, Redis or workers with the live
# `cloud-wms-erpnext` stack, because the app's idempotency code commits mid-request.
x-env: &env
  image: cloud-wms/erpnext:v16.60.0-wms
  environment:
    DB_HOST: db
    REDIS_CACHE: redis-cache:6379
    REDIS_QUEUE: redis-queue:6379
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

services:
  db:
    image: mariadb:11.8
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
    environment:
      MARIADB_ROOT_PASSWORD: admin
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:6.2-alpine

  redis-queue:
    image: redis:6.2-alpine

  runner:
    <<: *env
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    entrypoint: ["bash", "-c"]
    command: ["true"]

volumes:
  db-data:
  sites:
  logs:
